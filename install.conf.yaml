- defaults:
    link:
      relink: true
      create: true
      force: true

- clean: ['~']

- link:
    ~/.pam_environment: pam_environment
    ~/.tmux.conf: tmux.conf
    ~/.zshrc: zsh/zshrc
    ~/.config/environment.d/im.conf: environment/input-method.conf
    ~/.config/fcitx5/config: fcitx5/config
    ~/.local/share/fcitx5/addon/rime_state_reset.conf: fcitx5/addon/rime_state_reset.conf
    ~/.local/share/fcitx5/lua/rime_state_reset/main.lua: fcitx5/lua/rime_state_reset/main.lua
    ~/.local/share/fcitx5/rime/default.custom.yaml: fcitx5/rime/default.custom.yaml
    ~/.config/nvim/init.lua: init.lua
    ~/.config/nvim/lua:
      glob: true
      path: lua/*
    ~/.config/ranger: ranger
    ~/.config/kitty/kitty.conf: kitty/kitty.conf
    ~/.config/kitty/light-theme.auto.conf: kitty/gruvbox-light.conf
    ~/.config/kitty/no-preference-theme.auto.conf: kitty/gruvbox-light.conf
    ~/.config/kitty/dark-theme.auto.conf: kitty/gruvbox-dark.conf
    ~/.config/xdg-terminals.list: kitty/xdg-terminals.list
    ~/.config/starship.toml: starship/starship.toml
    ~/.gitignore_global: gitignore_global
    ~/.local/bin/obsidian-sync: obsidian/bin/obsidian-sync
    ~/.local/bin/obsidian-sync-init: obsidian/bin/obsidian-sync-init
    ~/.config/rclone/obsidian-bisync-filter.txt: obsidian/rclone/obsidian-bisync-filter.txt
    ~/.local/bin/ros2-ws-sync: ros2/bin/ros2-ws-sync
    ~/.local/bin/ros2-ws-sync-init: ros2/bin/ros2-ws-sync-init
    ~/.local/bin/fd: bin/fd
    ~/ros2_ws/.envrc: ros2/envrc
    ~/.config/rclone/ros2-ws-bisync-filter.txt: ros2/rclone/ros2-ws-bisync-filter.txt
    ~/.config/systemd/user/obsidian-sync-on-login.service: obsidian/systemd/user/obsidian-sync-on-login.service
    ~/.codex/AGENTS.md: codex/AGENTS.md
    ~/.ssh/config: ssh/config
