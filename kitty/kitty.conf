# 字体
font_family Maple Mono NF
font_size 14.0

# 回滚与复制
scrollback_lines 200000
copy_on_select yes
strip_trailing_spaces smart

# URL
detect_urls yes
url_style double
open_url_with default

# 主题跟随系统明暗模式，配色文件由 Catppuccin 官方仓库提供
# 背景与 Neovim Gruvbox 浅色模式保持一致
background #fbf1c7

# Shell 集成
shell_integration enabled
